<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KasirKu Master - Inventory & POS</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com">
    </script>
    <!-- React 18 -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js">
    </script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js">
    </script>
    <!-- Babel standalone untuk JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js">
    </script>
    <!-- Dexie.js untuk IndexedDB -->
    <script src="https://unpkg.com/dexie@3.2.4/dist/dexie.js">
    </script>

    <!-- Font Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

    <style>
        :root {
            --primary: #2563eb;
            --primary-light: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg-dark: #0f172a;
            --surface: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --radius-lg: 1rem;
            --radius-xl: 1.25rem;
            --radius-2xl: 2rem;
            --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-modal: 0 20px 60px rgba(0, 0, 0, 0.3);
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
        }
        input,
        select,
        textarea {
            -webkit-user-select: text;
            user-select: text;
        }

        html,
        body {
            background-color: var(--bg-dark);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            overscroll-behavior: none;
        }

        #root {
            width: 100%;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-shell {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            background: #f8fafc;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 80px rgba(0, 0, 0, 0.4);
        }

        @media (min-width: 481px) {
            .app-shell {
                border-radius: 0;
                margin: 0;
            }
        }

        /* Utility */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Smooth tap */
        .tap-effect {
            transition: var(--transition);
            cursor: pointer;
        }
        .tap-effect:active {
            transform: scale(0.94);
            opacity: 0.85;
        }

        /* Modal overlay */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: 100;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .modal-sheet {
            background: #fff;
            width: 100%;
            max-width: 480px;
            max-height: 88vh;
            border-radius: 1.5rem 1.5rem 0 0;
            overflow-y: auto;
            animation: slideUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: var(--shadow-modal);
        }
        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }
            to {
                transform: translateY(0);
            }
        }
        .modal-handle {
            width: 36px;
            height: 4px;
            background: #cbd5e1;
            border-radius: 2px;
            margin: 0 auto 14px;
            position: sticky;
            top: 12px;
            z-index: 2;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback, useRef } = React;

        // ──────────────────────────────
        //  DATABASE (Dexie.js - IndexedDB)
        // ──────────────────────────────
        const db = new Dexie('kasirku_master_v5');
        db.version(1).stores({
            menus: 'id, category',
            stocks: 'id',
            txs: 'id, createdAt',
            opex: 'id, createdAt',
            waste: 'id, createdAt',
        });

        // ──────────────────────────────
        //  SEED DATA AWAL
        // ──────────────────────────────
        const seedInitialData = async () => {
            const menuCount = await db.menus.count();
            if (menuCount > 0) return;

            const now = new Date().toISOString();
            await db.stocks.bulkAdd([
                { id: 'stk-1', name: 'Beras Premium', unit: 'kg', price: 14000, qty: 20, createdAt: now },
                { id: 'stk-2', name: 'Minyak Goreng', unit: 'L', price: 18000, qty: 15, createdAt: now },
                { id: 'stk-3', name: 'Daging Ayam', unit: 'kg', price: 38000, qty: 10, createdAt: now },
                { id: 'stk-4', name: 'Teh Celup', unit: 'pcs', price: 500, qty: 100, createdAt: now },
                { id: 'stk-5', name: 'Gula Pasir', unit: 'kg', price: 16000, qty: 10, createdAt: now },
                { id: 'stk-6', name: 'Susu UHT', unit: 'L', price: 20000, qty: 8, createdAt: now },
                { id: 'stk-7', name: 'Buah Mangga', unit: 'kg', price: 25000, qty: 5, createdAt: now },
            ]);

            await db.menus.bulkAdd([
                {
                    id: 'm-1',
                    name: 'Nasi Goreng Ayam',
                    category: 'Makanan',
                    price: 25000,
                    icon: '🍳',
                    ingredients: [
                        { stockId: 'stk-1', qty: 0.15 },
                        { stockId: 'stk-2', qty: 0.02 },
                        { stockId: 'stk-3', qty: 0.08 },
                    ],
                    createdAt: now,
                },
                {
                    id: 'm-2',
                    name: 'Ayam Goreng Crispy',
                    category: 'Makanan',
                    price: 22000,
                    icon: '🍗',
                    ingredients: [
                        { stockId: 'stk-2', qty: 0.03 },
                        { stockId: 'stk-3', qty: 0.2 },
                    ],
                    createdAt: now,
                },
                {
                    id: 'm-3',
                    name: 'Es Teh Manis',
                    category: 'Minuman',
                    price: 6000,
                    icon: '🧊',
                    ingredients: [
                        { stockId: 'stk-4', qty: 1 },
                        { stockId: 'stk-5', qty: 0.02 },
                    ],
                    createdAt: now,
                },
                {
                    id: 'm-4',
                    name: 'Es Latte Susu',
                    category: 'Minuman',
                    price: 18000,
                    icon: '🧋',
                    ingredients: [
                        { stockId: 'stk-6', qty: 0.2 },
                        { stockId: 'stk-5', qty: 0.01 },
                    ],
                    createdAt: now,
                },
                {
                    id: 'm-5',
                    name: 'Pudding Mangga',
                    category: 'Dessert',
                    price: 15000,
                    icon: '🍮',
                    ingredients: [
                        { stockId: 'stk-7', qty: 0.1 },
                        { stockId: 'stk-5', qty: 0.02 },
                    ],
                    createdAt: now,
                },
            ]);
        };

        // ──────────────────────────────
        //  KOMPONEN UTAMA
        // ──────────────────────────────
        const App = () => {
            const [tab, setTab] = useState('kasir');
            const [menus, setMenus] = useState([]);
            const [stocks, setStocks] = useState([]);
            const [txs, setTxs] = useState([]);
            const [opexList, setOpexList] = useState([]);
            const [wasteList, setWasteList] = useState([]);
            const [loading, setLoading] = useState(true);

            // Global date filter
            const [datePreset, setDatePreset] = useState('semua');
            const [customStart, setCustomStart] = useState('');
            const [customEnd, setCustomEnd] = useState('');

            // Cart
            const [cart, setCart] = useState([]);
            const [kasirCat, setKasirCat] = useState('Makanan');

            // Modal visibility
            const [checkoutModal, setCheckoutModal] = useState(false);
            const [receiptModal, setReceiptModal] = useState(null);
            const [opexModal, setOpexModal] = useState(false);
            const [wasteModal, setWasteModal] = useState(false);
            const [menuModal, setMenuModal] = useState(false);
            const [bahanModal, setBahanModal] = useState(false);

            // Form states
            const [editingMenu, setEditingMenu] = useState(null);
            const [formOpex, setFormOpex] = useState({ category: 'Listrik', amount: '', note: '' });
            const [formWaste, setFormWaste] = useState({ stockId: '', qty: '', note: '' });
            const [formBahan, setFormBahan] = useState({ name: '', unit: 'kg', price: '', qty: '' });
            const [formMenu, setFormMenu] = useState({
                name: '',
                category: 'Makanan',
                price: '',
                icon: '🍽️',
                ingredients: [{ stockId: '', qty: '' }],
            });

            // Riwayat sub-tab
            const [riwayatSubTab, setRiwayatSubTab] = useState('transaksi');

            // ──────────── LOAD DATA ────────────
            const loadData = useCallback(async () => {
                try {
                    await seedInitialData();
                    const [m, s, t, o, w] = await Promise.all([
                        db.menus.toArray(),
                        db.stocks.toArray(),
                        db.txs.orderBy('createdAt').reverse().toArray(),
                        db.opex.orderBy('createdAt').reverse().toArray(),
                        db.waste.orderBy('createdAt').reverse().toArray(),
                    ]);
                    setMenus(m);
                    setStocks(s);
                    setTxs(t);
                    setOpexList(o);
                    setWasteList(w);
                } catch (err) {
                    console.error('Gagal memuat data:', err);
                    alert('Terjadi kesalahan saat memuat data. Silakan muat ulang halaman.');
                } finally {
                    setLoading(false);
                }
            }, []);

            useEffect(() => {
                loadData();
            }, [loadData]);

            // ──────────── HELPER ────────────
            const getMenuCOGS = useCallback(
                (recipe) => {
                    if (!recipe || !recipe.length) return 0;
                    return recipe.reduce((acc, curr) => {
                        const stk = stocks.find((s) => s.id === curr.stockId);
                        return acc + (stk ? stk.price * (parseFloat(curr.qty) || 0) : 0);
                    }, 0);
                },
                [stocks],
            );

            // ──────────── DATE FILTERING ────────────
            const getDateRange = useCallback(() => {
                const now = new Date();
                let start, end;
                switch (datePreset) {
                    case 'hariIni':
                        start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                        end = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59);
                        break;
                    case 'kemarin':
                        const y = new Date(now);
                        y.setDate(y.getDate() - 1);
                        start = new Date(y.getFullYear(), y.getMonth(), y.getDate());
                        end = new Date(y.getFullYear(), y.getMonth(), y.getDate(), 23, 59, 59);
                        break;
                    case 'bulanIni':
                        start = new Date(now.getFullYear(), now.getMonth(), 1);
                        end = new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59);
                        break;
                    case 'tahunLalu':
                        start = new Date(now.getFullYear() - 1, 0, 1);
                        end = new Date(now.getFullYear() - 1, 11, 31, 23, 59, 59);
                        break;
                    case 'custom':
                        if (customStart && customEnd) {
                            start = new Date(customStart);
                            end = new Date(customEnd);
                            end.setHours(23, 59, 59);
                        } else {
                            start = new Date(now.getFullYear(), now.getMonth(), 1);
                            end = new Date();
                        }
                        break;
                    default:
                        start = new Date(2000, 0, 1);
                        end = new Date(2099, 11, 31);
                }
                return { start, end };
            }, [datePreset, customStart, customEnd]);

            const dateRange = useMemo(() => getDateRange(), [getDateRange]);

            const isWithinRange = useCallback(
                (dateStr) => {
                    const d = new Date(dateStr);
                    return d >= dateRange.start && d <= dateRange.end;
                },
                [dateRange],
            );

            const filteredTxs = useMemo(() => txs.filter((t) => isWithinRange(t.createdAt)), [txs, isWithinRange]);
            const filteredOpex = useMemo(() => opexList.filter((o) => isWithinRange(o.createdAt)), [
                opexList,
                isWithinRange,
            ]);
            const filteredWaste = useMemo(() => wasteList.filter((w) => isWithinRange(w.createdAt)), [
                wasteList,
                isWithinRange,
            ]);

            // ──────────── FINANCIAL CALCULATIONS ────────────
            const totalRevenue = useMemo(() => filteredTxs.reduce((a, b) => a + b.total, 0), [filteredTxs]);
            const totalCOGS = useMemo(() => filteredTxs.reduce((a, b) => a + (b.hppTotal || 0), 0), [filteredTxs]);
            const grossProfit = totalRevenue - totalCOGS;
            const totalOpex = useMemo(() => filteredOpex.reduce((a, b) => a + b.amount, 0), [filteredOpex]);
            const netProfit = grossProfit - totalOpex;
            const totalStockValue = useMemo(() => stocks.reduce((a, b) => a + b.qty * b.price, 0), [stocks]);
            const totalItemsSold = useMemo(
                () => filteredTxs.reduce((acc, tx) => acc + tx.items.reduce((sum, item) => sum + item.qty, 0), 0),
                [filteredTxs],
            );
            const totalWasteCost = useMemo(
                () => filteredWaste.reduce((a, b) => a + b.estimatedLoss, 0),
                [filteredWaste],
            );

            // ──────────── CART HANDLERS ────────────
            const addToCart = (menu) => {
                setCart((prev) => {
                    const exist = prev.find((c) => c.id === menu.id);
                    if (exist) return prev.map((c) => (c.id === menu.id ? { ...c, qty: c.qty + 1 } : c));
                    return [...prev, { ...menu, qty: 1 }];
                });
            };

            const updateCartQty = (id, delta) => {
                setCart((prev) =>
                    prev
                        .map((c) => {
                            if (c.id === id) {
                                const newQty = c.qty + delta;
                                return newQty > 0 ? { ...c, qty: newQty } : null;
                            }
                            return c;
                        })
                        .filter(Boolean),
                );
            };

            const removeFromCart = (id) => {
                setCart((prev) => prev.filter((c) => c.id !== id));
            };

            // ──────────── CHECKOUT (DENGAN TRANSAKSI DB) ────────────
            const handleCheckout = async () => {
                if (!cart.length) return;
                try {
                    await db.transaction('rw', db.stocks, db.txs, async () => {
                        // Verifikasi & kalkulasi HPP dari data terkini di DB
                        const itemsData = [];
                        for (let item of cart) {
                            let itemHpp = 0;
                            if (item.ingredients && item.ingredients.length > 0) {
                                for (let ing of item.ingredients) {
                                    const stk = await db.stocks.get(ing.stockId);
                                    if (!stk) throw new Error(`Bahan ${ing.stockId} tidak ditemukan di gudang!`);
                                    const requiredQty = ing.qty * item.qty;
                                    if (stk.qty < requiredQty) {
                                        throw new Error(
                                            `Stok "${stk.name}" tidak cukup!\nButuh: ${requiredQty.toFixed(2)} ${stk.unit}\nSisa: ${stk.qty.toFixed(2)} ${stk.unit}`,
                                        );
                                    }
                                    itemHpp += stk.price * ing.qty;
                                    // Potong stok
                                    await db.stocks.update(stk.id, { qty: Math.max(0, stk.qty - requiredQty) });
                                }
                            }
                            itemsData.push({
                                menuId: item.id,
                                name: item.name,
                                price: item.price,
                                qty: item.qty,
                                hpp: itemHpp,
                            });
                        }

                        const txTotal = itemsData.reduce((a, b) => a + b.price * b.qty, 0);
                        const txHppTotal = itemsData.reduce((a, b) => a + b.hpp * b.qty, 0);

                        const newTx = {
                            id: 'TRX-' + Date.now().toString(36).slice(-6).toUpperCase(),
                            createdAt: new Date().toISOString(),
                            items: itemsData,
                            total: txTotal,
                            hppTotal: txHppTotal,
                            profit: txTotal - txHppTotal,
                        };
                        await db.txs.add(newTx);
                        setReceiptModal(newTx);
                    });
                    setCart([]);
                    setCheckoutModal(false);
                    await loadData();
                } catch (err) {
                    alert('❌ ' + (err.message || 'Gagal melakukan checkout.'));
                }
            };

            // ──────────── OPEX ────────────
            const handleSaveOpex = async () => {
                if (!formOpex.amount || isNaN(formOpex.amount) || parseFloat(formOpex.amount) <= 0)
                    return alert('Isi nominal pengeluaran dengan benar!');
                try {
                    await db.opex.add({
                        id: 'OPX-' + Date.now().toString(36).slice(-4).toUpperCase(),
                        createdAt: new Date().toISOString(),
                        category: formOpex.category,
                        amount: parseFloat(formOpex.amount),
                        note: formOpex.note || '-',
                    });
                    setFormOpex({ category: 'Listrik', amount: '', note: '' });
                    setOpexModal(false);
                    await loadData();
                } catch (err) {
                    alert('Gagal menyimpan OPEX.');
                }
            };

            const handleDeleteOpex = async (id) => {
                if (confirm('Hapus catatan OPEX ini?')) {
                    await db.opex.delete(id);
                    await loadData();
                }
            };

            // ──────────── WASTE ────────────
            const handleSaveWaste = async () => {
                if (!formWaste.stockId || !formWaste.qty || parseFloat(formWaste.qty) <= 0)
                    return alert('Pilih bahan dan isi jumlah yang valid!');
                const wasteQty = parseFloat(formWaste.qty);
                try {
                    await db.transaction('rw', db.stocks, db.waste, async () => {
                        const stk = await db.stocks.get(formWaste.stockId);
                        if (!stk) throw new Error('Bahan tidak ditemukan.');
                        if (wasteQty > stk.qty) throw new Error(`Stok tidak cukup! Sisa: ${stk.qty.toFixed(2)} ${stk.unit}`);
                        const lossCost = wasteQty * stk.price;
                        await db.stocks.update(stk.id, { qty: stk.qty - wasteQty });
                        await db.waste.add({
                            id: 'WST-' + Date.now().toString(36).slice(-4).toUpperCase(),
                            createdAt: new Date().toISOString(),
                            stockId: stk.id,
                            stockName: stk.name,
                            qty: wasteQty,
                            unit: stk.unit,
                            estimatedLoss: lossCost,
                            note: formWaste.note || 'Rusak/Hilang',
                        });
                    });
                    setFormWaste({ stockId: '', qty: '', note: '' });
                    setWasteModal(false);
                    await loadData();
                } catch (err) {
                    alert('❌ ' + (err.message || 'Gagal menyimpan waste.'));
                }
            };

            const handleDeleteWaste = async (id) => {
                if (confirm('Hapus catatan waste ini?')) {
                    await db.waste.delete(id);
                    await loadData();
                }
            };

            // ──────────── BAHAN (STOCK) ────────────
            const handleSaveBahan = async () => {
                if (!formBahan.name || !formBahan.price || !formBahan.qty)
                    return alert('Isi semua data bahan baku!');
                try {
                    await db.stocks.add({
                        id: 'stk-' + Date.now().toString(36).slice(-6),
                        name: formBahan.name,
                        unit: formBahan.unit,
                        price: parseFloat(formBahan.price),
                        qty: parseFloat(formBahan.qty),
                        createdAt: new Date().toISOString(),
                    });
                    setFormBahan({ name: '', unit: 'kg', price: '', qty: '' });
                    setBahanModal(false);
                    await loadData();
                } catch (err) {
                    alert('Gagal menambah bahan baku.');
                }
            };

            const handleDeleteStock = async (id) => {
                if (confirm('⚠️ Hapus bahan baku ini? Menu yang menggunakannya akan kehilangan referensi resep.')) {
                    await db.stocks.delete(id);
                    // Bersihkan referensi di resep menu
                    const allMenus = await db.menus.toArray();
                    for (let m of allMenus) {
                        if (m.ingredients && m.ingredients.some((ing) => ing.stockId === id)) {
                            const cleaned = m.ingredients.filter((ing) => ing.stockId !== id);
                            await db.menus.update(m.id, { ingredients: cleaned });
                        }
                    }
                    await loadData();
                }
            };

            // ──────────── MENU ────────────
            const handleEditMenu = (menu) => {
                setEditingMenu(menu);
                setFormMenu({
                    name: menu.name,
                    category: menu.category,
                    price: String(menu.price),
                    icon: menu.icon || '🍽️',
                    ingredients: menu.ingredients && menu.ingredients.length > 0 ?
                        menu.ingredients.map((ing) => ({ stockId: ing.stockId, qty: String(ing.qty) })) :
                        [{ stockId: '', qty: '' }],
                });
                setMenuModal(true);
            };

            const handleSaveMenu = async () => {
                if (!formMenu.name || !formMenu.price || parseFloat(formMenu.price) <= 0)
                    return alert('Nama dan harga menu wajib diisi!');
                const validIngredients = formMenu.ingredients
                    .filter((i) => i.stockId && i.qty && parseFloat(i.qty) > 0)
                    .map((i) => ({ stockId: i.stockId, qty: parseFloat(i.qty) }));

                try {
                    if (editingMenu) {
                        await db.menus.update(editingMenu.id, {
                            name: formMenu.name,
                            category: formMenu.category,
                            price: parseFloat(formMenu.price),
                            icon: formMenu.icon || '🍽️',
                            ingredients: validIngredients,
                        });
                    } else {
                        await db.menus.add({
                            id: 'm-' + Date.now().toString(36).slice(-6),
                            name: formMenu.name,
                            category: formMenu.category,
                            price: parseFloat(formMenu.price),
                            icon: formMenu.icon || '🍽️',
                            ingredients: validIngredients,
                            createdAt: new Date().toISOString(),
                        });
                    }
                    setEditingMenu(null);
                    setFormMenu({ name: '', category: 'Makanan', price: '', icon: '🍽️', ingredients: [{ stockId: '',
                            qty: '' }] });
                    setMenuModal(false);
                    await loadData();
                } catch (err) {
                    alert('Gagal menyimpan menu.');
                }
            };

            const handleDeleteMenu = async (id) => {
                if (confirm('Hapus menu ini?')) {
                    await db.menus.delete(id);
                    await loadData();
                }
            };

            const addIngredientRow = () => {
                setFormMenu((prev) => ({ ...prev, ingredients: [...prev.ingredients, { stockId: '', qty: '' }] }));
            };

            const removeIngredientRow = (idx) => {
                setFormMenu((prev) => ({
                    ...prev,
                    ingredients: prev.ingredients.filter((_, i) => i !== idx),
                }));
            };

            const updateIngredient = (idx, field, value) => {
                setFormMenu((prev) => {
                    const newIngredients = [...prev.ingredients];
                    newIngredients[idx] = { ...newIngredients[idx], [field]: value };

                            { id: 'kasir', label: 'Kasir', icon: '🛒' },
                            { id: 'gudang', label: 'Gudang', icon: '📦' },
                            { id: 'laporan', label: 'Laporan', icon: '📊' },
                            { id: 'riwayat', label: 'Riwayat', icon: '📜' },
                            { id: 'pengaturan', label: 'Atur', icon: '⚙️' },
                        ].map((t) => (
                            <button
                                key={t.id}
                                onClick={() => setTab(t.id)}
                                className={`flex flex-col items-center gap-0.5 text-[10px] font-bold px-3 py-1 rounded-xl transition-all ${
                                    tab === t.id
                                        ? 'text-blue-600 bg-blue-50'
                                        : 'text-slate-400 hover:text-slate-600'
                                }`}
                            >
                                <span className="text-lg leading-none">{t.icon}</span>
                                {t.label}
                            </button>
                        ))}
                    </nav>
                </div>
            );
        };

        // ──────────── MOUNT APP ────────────
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
  </html>
