<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KasirKu Master - Multi Business Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/dexie@3.2.4/dist/dexie.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        html, body { background-color: #0f172a; margin: 0; padding: 0; min-height: 100vh; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 480px; min-height: 100vh; background: #ffffff; position: relative; display: flex; flex-direction: column; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root" class="w-full flex justify-center"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // DB Schema dengan Multitenant (companyId Isolation)
        const db = new Dexie('kasirku_multitenant_master_v1');
        db.version(1).stores({
            users: '++id, username',
            companies: '++id, userId',
            menus: '++id, companyId, category',
            stocks: '++id, companyId',
            txs: '++id, companyId, createdAt',
            opex: '++id, companyId, createdAt',
            waste: '++id, companyId, createdAt'
        });

        function App() {
            // Auth & Multi-tenant State
            const [currentUser, setCurrentUser] = useState(null);
            const [companies, setCompanies] = useState([]);
            const [activeCompany, setActiveCompany] = useState(null);
            const [isSignUp, setIsSignUp] = useState(false);
            const [authUsername, setAuthUsername] = useState('');
            const [authPassword, setAuthPassword] = useState('');
            const [newCompName, setNewCompName] = useState('');
            const [newCompType, setNewCompType] = useState('Kuliner');

            // App State
            const [tab, setTab] = useState('kasir');
            const [menus, setMenus] = useState([]);
            const [stocks, setStocks] = useState([]);
            const [txs, setTxs] = useState([]);
            const [opexList, setOpexList] = useState([]);
            const [wasteList, setWasteList] = useState([]);
            const [cart, setCart] = useState([]);
            const [kasirCat, setKasirCat] = useState('Makanan');

            // Modals
            const [checkoutModal, setCheckoutModal] = useState(false);
            const [receiptModal, setReceiptModal] = useState(null);
            const [opexModal, setOpexModal] = useState(false);
            const [wasteModal, setWasteModal] = useState(false);
            const [menuModal, setMenuModal] = useState(false);
            const [bahanModal, setBahanModal] = useState(false);

            // Forms
            const [formOpex, setFormOpex] = useState({ category: 'Operational', amount: '', note: '' });
            const [formWaste, setFormWaste] = useState({ stockId: '', qty: '', note: '' });
            const [formBahan, setFormBahan] = useState({ name: '', unit: 'pcs', price: '', qty: '' });
            const [formMenu, setFormMenu] = useState({ name: '', category: 'Makanan', price: '', icon: '📦', ingredients: [{ stockId: '', qty: '' }] });

            // 1. Auth Handler
            const handleAuth = async (e) => {
                e.preventDefault();
                if(!authUsername || !authPassword) return alert("Isi username & password!");

                if(isSignUp) {
                    const exist = await db.users.where('username').equals(authUsername).first();
                    if(exist) return alert("Username sudah terpakai!");
                    await db.users.add({ username: authUsername, password: authPassword });
                    alert("Akun berhasil dibuat! Silakan Login.");
                    setIsSignUp(false);
                } else {
                    const user = await db.users.where({ username: authUsername, password: authPassword }).first();
                    if(!user) return alert("Username atau Password salah!");
                    setCurrentUser(user);
                    await loadCompanies(user.id);
                }
            };

            // 2. Load Usaha User
            const loadCompanies = async (userId) => {
                const list = await db.companies.where('userId').equals(userId).toArray();
                setCompanies(list);
                if(list.length > 0) {
                    setActiveCompany(list[0]);
                } else {
                    setActiveCompany(null);
                }
            };

            // 3. Tambah Usaha Baru
            const handleAddCompany = async (e) => {
                e.preventDefault();
                if(!newCompName) return;
                const id = await db.companies.add({
                    userId: currentUser.id,
                    name: newCompName,
                    type: newCompType
                });
                setNewCompName('');
                await loadCompanies(currentUser.id);
            };

            // 4. Load Data spesifik per Active Company (Tenant Isolation)
            const loadTenantData = async () => {
                if(!activeCompany) return;
                const cId = activeCompany.id;
                setMenus(await db.menus.where('companyId').equals(cId).toArray());
                setStocks(await db.stocks.where('companyId').equals(cId).toArray());
                setTxs(await db.txs.where('companyId').equals(cId).reverse().toArray());
                setOpexList(await db.opex.where('companyId').equals(cId).reverse().toArray());
                setWasteList(await db.waste.where('companyId').equals(cId).reverse().toArray());
                setCart([]);
            };

            useEffect(() => { loadTenantData(); }, [activeCompany]);

            // Hitung HPP
            const getMenuCOGS = (recipe) => {
                if (!recipe || !recipe.length) return 0;
                return recipe.reduce((acc, curr) => {
                    const stk = stocks.find(s => s.id === parseInt(curr.stockId));
                    return acc + (stk ? stk.price * (parseFloat(curr.qty) || 0) : 0);
                }, 0);
            };

            // Financial Calculations
            const totalRevenue = useMemo(() => txs.reduce((a, b) => a + b.total, 0), [txs]);
            const totalCOGS = useMemo(() => txs.reduce((a, b) => a + (b.hppTotal || 0), 0), [txs]);
            const grossProfit = totalRevenue - totalCOGS;
            const totalOpex = useMemo(() => opexList.reduce((a, b) => a + b.amount, 0), [opexList]);
            const netProfit = grossProfit - totalOpex;
            const totalStockValue = useMemo(() => stocks.reduce((a, b) => a + (b.qty * b.price), 0), [stocks]);

            // Transaksi Checkout
            const handleCheckout = async () => {
                if (!cart.length || !activeCompany) return;

                // Cek Stok Gudang
                for (let item of cart) {
                    if (item.ingredients) {
                        for (let ing of item.ingredients) {
                            const stk = stocks.find(s => s.id === parseInt(ing.stockId));
                            const reqQty = ing.qty * item.qty;
                            if (!stk || stk.qty < reqQty) {
                                alert(`Stok ${stk ? stk.name : 'Bahan'} tidak cukup! Butuh ${reqQty.toFixed(2)}, Sisa: ${stk?.qty || 0}`);
                                return;
                            }
                        }
                    }
                }

                // Potong Stok
                for (let item of cart) {
                    if (item.ingredients) {
                        for (let ing of item.ingredients) {
                            const stk = stocks.find(s => s.id === parseInt(ing.stockId));
                            if (stk) {
                                await db.stocks.update(stk.id, { qty: stk.qty - (ing.qty * item.qty) });
                            }
                        }
                    }
                }

                const itemsData = cart.map(c => ({
                    menuId: c.id, name: c.name, price: c.price, qty: c.qty, hpp: getMenuCOGS(c.ingredients)
                }));
                const txTotal = itemsData.reduce((a, b) => a + (b.price * b.qty), 0);
                const txHppTotal = itemsData.reduce((a, b) => a + (b.hpp * b.qty), 0);

                const newTx = {
                    companyId: activeCompany.id,
                    createdAt: new Date().toISOString(),
                    items: itemsData,
                    total: txTotal,
                    hppTotal: txHppTotal,
                    profit: txTotal - txHppTotal
                };

                const txId = await db.txs.add(newTx);
                setReceiptModal({ ...newTx, id: 'TRX-' + txId });
                setCart([]);
                setCheckoutModal(false);
                await loadTenantData();
            };

            // Simpan Bahan Gudang Baru
            const handleSaveBahan = async () => {
                if (!formBahan.name || !formBahan.price || !formBahan.qty || !activeCompany) return alert("Lengkapi data!");
                await db.stocks.add({
                    companyId: activeCompany.id,
                    name: formBahan.name,
                    unit: formBahan.unit,
                    price: parseFloat(formBahan.price),
                    qty: parseFloat(formBahan.qty)
                });
                setFormBahan({ name: '', unit: 'pcs', price: '', qty: '' });
                setBahanModal(false);
                await loadTenantData();
            };

            // Simpan Menu Baru
            const handleSaveMenu = async () => {
                if (!formMenu.name || !formMenu.price || !activeCompany) return alert("Lengkapi data!");
                const validIng = formMenu.ingredients.filter(i => i.stockId && i.qty);
                
                await db.menus.add({
                    companyId: activeCompany.id,
                    name: formMenu.name,
                    category: formMenu.category,
                    price: parseFloat(formMenu.price),
                    icon: formMenu.icon || '📦',
                    ingredients: validIng
                });

                setFormMenu({ name: '', category: 'Makanan', price: '', icon: '📦', ingredients: [{ stockId: '', qty: '' }] });
                setMenuModal(false);
                await loadTenantData();
            };

            // ----------------------------------------------------
            // SCREEN 1: LOGIN / SIGN UP
            // ----------------------------------------------------
            if (!currentUser) {
                return (
                    <div className="app-container p-6 flex flex-col justify-center bg-slate-900 text-white">
                        <div className="text-center mb-8">
                            <h1 className="text-3xl font-black text-blue-400">KasirKu Engine</h1>
                            <p className="text-xs font-bold text-slate-400 mt-1">Multi-Business & Inventory System</p>
                        </div>

                        <form onSubmit={handleAuth} className="bg-slate-800 p-5 rounded-3xl border border-slate-700 space-y-4">
                            <h2 className="font-extrabold text-sm text-slate-200">{isSignUp ? 'Daftar Akun Baru' : 'Masuk ke Sistem'}</h2>
                            <div>
                                <label className="text-xs font-bold text-slate-400 block mb-1">Username</label>
                                <input type="text" value={authUsername} onChange={e=>setAuthUsername(e.target.value)} className="w-full p-3 border border-slate-600 rounded-xl text-xs font-bold bg-slate-900 text-white outline-none" placeholder="Masukkan username" />
                            </div>
                            <div>
                                <label className="text-xs font-bold text-slate-400 block mb-1">Password</label>
                                <input type="password" value={authPassword} onChange={e=>setAuthPassword(e.target.value)} className="w-full p-3 border border-slate-600 rounded-xl text-xs font-bold bg-slate-900 text-white outline-none" placeholder="******" />
                            </div>
                            <button type="submit" className="w-full py-3.5 bg-blue-600 font-extrabold text-xs rounded-xl shadow-lg">
                                {isSignUp ? 'Sign Up' : 'Sign In'}
                            </button>
                        </form>

                        <button onClick={() => setIsSignUp(!isSignUp)} className="mt-4 text-xs font-bold text-blue-400 text-center">
                            {isSignUp ? 'Sudah punya akun? Login' : 'Belum punya akun? Buat Baru'}
                        </button>
                    </div>
                );
            }

            // ----------------------------------------------------
            // SCREEN 2: MAIN DASHBOARD
            // ----------------------------------------------------
            return (
                <div className="app-container border-x border-slate-200 shadow-2xl">
                    {/* TENANT HEADER SWITCHER */}
                    <header className="p-3 bg-slate-900 text-white sticky top-0 z-20 flex justify-between items-center">
                        <div className="flex items-center gap-2">
                            <span className="text-xl">🏢</span>
                            <div>
                                <span className="text-[9px] font-black text-slate-400 uppercase block">Usaha Active:</span>
                                <select 
                                    value={activeCompany?.id || ''} 
                                    onChange={(e) => setActiveCompany(companies.find(c => c.id === parseInt(e.target.value)))}
                                    className="font-extrabold text-xs bg-slate-800 text-blue-400 rounded-lg px-2 py-1 outline-none border border-slate-700 cursor-pointer"
                                >
                                    {companies.map(c => (
                                        <option key={c.id} value={c.id}>{c.name} ({c.type})</option>
                                    ))}
                                </select>
                            </div>
                        </div>
                        <button onClick={() => setCurrentUser(null)} className="text-[10px] font-extrabold text-red-400 bg-red-950/50 border border-red-800 px-2.5 py-1 rounded-lg">Logout</button>
                    </header>

                    {/* JIKA USER BELUM PUNYA USAHA */}
                    {!activeCompany ? (
                        <div className="p-6 flex-1 flex flex-col justify-center items-center text-center">
                            <div className="p-4 bg-amber-50 border border-amber-200 rounded-3xl space-y-3 w-full">
                                <h3 className="font-extrabold text-sm text-amber-800">Belum Ada Unit Usaha</h3>
                                <p className="text-xs text-amber-700">Buat entity usaha pertama kamu (misal: Bengkel Otomotif / Resto Culinary) untuk memisah data gudang dan kasir.</p>
                                <form onSubmit={handleAddCompany} className="space-y-2 text-left pt-2">
                                    <input type="text" value={newCompName} onChange={e=>setNewCompName(e.target.value)} placeholder="Nama Usaha (ex: Bengkel Maju)" className="w-full p-2.5 border rounded-xl text-xs font-bold" />
                                    <select value={newCompType} onChange={e=>setNewCompType(e.target.value)} className="w-full p-2.5 border rounded-xl text-xs font-bold">
                                        <option value="Kuliner">Kuliner / Makanan</option>
                                        <option value="Otomotif">Otomotif / Jasa</option>
                                        <option value="Ritel">Ritel / Toko</option>
                                    </select>
                                    <button type="submit" className="w-full py-2.5 bg-blue-600 text-white font-black text-xs rounded-xl">+ Tambah Usaha</button>
                                </form>
                            </div>
                        </div>
                    ) : (
                        <main className="flex-1 p-4 pb-28 overflow-y-auto w-full">
                            {/* TAB 1: KASIR */}
                            {tab === 'kasir' && (
                                <div>
                                    <div className="grid grid-cols-2 gap-3 mb-6">
                                        {menus.map(m => {
                                            const cogs = getMenuCOGS(m.ingredients);
                                            return (
                                                <div 
                                                    key={m.id} 
                                                    onClick={() => {
                                                        const exist = cart.find(c => c.id === m.id);
                                                        if(exist) setCart(cart.map(c => c.id === m.id ? {...c, qty: c.qty + 1} : c));
                                                        else setCart([...cart, {...m, qty: 1}]);
                                                    }}
                                                    className="p-3.5 bg-white border border-slate-200 rounded-2xl shadow-xs cursor-pointer active:scale-95 transition-all flex flex-col justify-between"
                                                >
                                                    <div>
                                                        <div className="flex justify-between items-start">
                                                            <div className="text-2xl mb-1">{m.icon}</div>
                                                            <span className="text-[9px] font-bold bg-amber-50 text-amber-700 px-1.5 py-0.5 rounded border border-amber-200">
                                                                HPP: Rp {cogs.toLocaleString('id-ID')}
                                                            </span>
                                                        </div>
                                                        <div className="font-extrabold text-slate-800 text-xs mt-1">{m.name}</div>
                                                        <div className="text-blue-600 font-black text-xs mt-0.5">Rp {m.price.toLocaleString('id-ID')}</div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>

                                    {cart.length > 0 && (
                                        <div className="p-4 bg-white border rounded-2xl space-y-2">
                                            <div className="font-extrabold text-xs text-slate-400 uppercase">Keranjang ({activeCompany.name})</div>
                                            {cart.map(c => (
                                                <div key={c.id} className="flex justify-between items-center text-xs py-1 border-b">
                                                    <div>
                                                        <div className="font-bold">{c.name}</div>
                                                        <div className="text-slate-400">Rp {(c.price * c.qty).toLocaleString('id-ID')}</div>
                                                    </div>
                                                    <span className="font-black bg-slate-100 px-2 py-1 rounded">{c.qty}x</span>
                                                </div>
                                            ))}
                                            <button onClick={() => setCheckoutModal(true)} className="w-full mt-2 py-3 bg-blue-600 text-white font-black text-xs rounded-xl">
                                                Bayar Rp {cart.reduce((a,b)=>a+(b.price*b.qty),0).toLocaleString('id-ID')}
                                            </button>
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* TAB 2: GUDANG INVENTORY */}
                            {tab === 'gudang' && (
                                <div className="space-y-4">
                                    <div className="p-4 bg-slate-900 text-white rounded-3xl space-y-1">
                                        <div className="text-[10px] font-bold text-slate-400 uppercase">Aset Gudang ({activeCompany.name})</div>
                                        <div className="text-xl font-black text-emerald-400">Rp {totalStockValue.toLocaleString('id-ID')}</div>
                                    </div>

                                    <div className="flex justify-between items-center">
                                        <h3 className="font-extrabold text-xs text-slate-700 uppercase">Sisa Persediaan</h3>
                                        <button onClick={() => setBahanModal(true)} className="px-2.5 py-1 bg-blue-600 text-white font-extrabold text-xs rounded-xl">+ Bahan Gudang</button>
                                    </div>

                                    <div className="space-y-2">
                                        {stocks.map(s => (
                                            <div key={s.id} className="p-3 bg-slate-50 border rounded-2xl flex justify-between items-center text-xs">
                                                <div>
                                                    <div className="font-extrabold text-slate-800">{s.name}</div>
                                                    <div className="text-slate-400">Harga Beli: Rp {s.price.toLocaleString('id-ID')} / {s.unit}</div>
                                                </div>
                                                <div className="text-right">
                                                    <div className="font-black text-slate-800">{s.qty.toFixed(2)} {s.unit}</div>
                                                    <div className="text-[10px] font-bold text-blue-600">Rp {(s.qty * s.price).toLocaleString('id-ID')}</div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* TAB 3: LAPORAN */}
                            {tab === 'laporan' && (
                                <div className="space-y-3">
                                    <h2 className="font-extrabold text-slate-800 text-sm">Laporan Keuangan: {activeCompany.name}</h2>
                                    <div className="grid grid-cols-2 gap-2 text-xs">
                                        <div className="p-3 bg-blue-50 rounded-2xl border border-blue-100">
                                            <div className="text-blue-600 font-bold">Revenue</div>
                                            <div className="font-black text-sm mt-1">Rp {totalRevenue.toLocaleString('id-ID')}</div>
                                        </div>
                                        <div className="p-3 bg-amber-50 rounded-2xl border border-amber-100">
                                            <div className="text-amber-600 font-bold">COGS / HPP</div>
                                            <div className="font-black text-sm mt-1">Rp {totalCOGS.toLocaleString('id-ID')}</div>
                                        </div>
                                    </div>
                                    <div className={`p-4 rounded-2xl text-white font-bold ${netProfit >= 0 ? 'bg-emerald-600' : 'bg-red-600'}`}>
                                        <div className="text-xs opacity-80">Net Profit ({activeCompany.name})</div>
                                        <div className="text-2xl font-black mt-1">Rp {netProfit.toLocaleString('id-ID')}</div>
                                    </div>
                                </div>
                            )}

                            {/* TAB 4: ATUR MENU & USAHA */}
                            {tab === 'pengaturan' && (
                                <div className="space-y-4">
                                    <div className="p-4 bg-white border rounded-2xl space-y-2">
                                        <div className="flex justify-between items-center">
                                            <h3 className="font-extrabold text-xs text-slate-800">Master Menu / Produk</h3>
                                            <button onClick={() => setMenuModal(true)} className="px-2.5 py-1 bg-blue-600 text-white font-extrabold text-xs rounded-xl">+ Menu Baru</button>
                                        </div>
                                        {menus.map(m => (
                                            <div key={m.id} className="p-2.5 bg-slate-50 rounded-xl text-xs flex justify-between items-center">
                                                <div>
                                                    <div className="font-bold">{m.icon} {m.name}</div>
                                                    <div className="text-slate-400">Rp {m.price.toLocaleString('id-ID')}</div>
                                                </div>
                                                <span className="text-[10px] bg-blue-50 text-blue-600 font-bold px-2 py-0.5 rounded">{m.ingredients?.length || 0} Bahan</span>
                                            </div>
                                        ))}
                                    </div>

                                    <div className="p-4 bg-white border rounded-2xl space-y-2">
                                        <h3 className="font-extrabold text-xs text-slate-800">➕ Tambah Entity Usaha Lain</h3>
                                        <form onSubmit={handleAddCompany} className="space-y-2">
                                            <input type="text" value={newCompName} onChange={e=>setNewCompName(e.target.value)} placeholder="Nama Usaha Lain" className="w-full p-2 border rounded-xl text-xs font-bold" />
                                            <button type="submit" className="w-full py-2 bg-slate-800 text-white font-bold text-xs rounded-xl">+ Buat Usaha Baru</button>
                                        </form>
                                    </div>
                                </div>
                            )}
                        </main>
                    )}

                    {/* MODAL CHECKOUT */}
                    {checkoutModal && (
                        <div className="fixed inset-0 bg-black/50 z-50 flex items-end justify-center">
                            <div className="bg-white w-full max-w-[480px] p-5 rounded-t-3xl space-y-3">
                                <h3 className="font-extrabold text-slate-800 text-base">Konfirmasi Pembayaran</h3>
                                <p className="text-xs text-slate-500">Stok persediaan gudang <b>{activeCompany.name}</b> akan terpotong secara otomatis.</p>
                                <div className="flex gap-2 pt-2">
                                    <button onClick={() => setCheckoutModal(false)} className="flex-1 py-3 border font-bold text-xs rounded-xl">Batal</button>
                                    <button onClick={handleCheckout} className="flex-1 py-3 bg-blue-600 text-white font-bold text-xs rounded-xl">Proses & Potong Stok</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL BAHAN GUDANG */}
                    {bahanModal && (
                        <div className="fixed inset-0 bg-black/50 z-50 flex items-end justify-center">
                            <div className="bg-white w-full max-w-[480px] p-5 rounded-t-3xl space-y-3">
                                <h3 className="font-extrabold text-slate-800 text-sm">Tambah Bahan Gudang ({activeCompany.name})</h3>
                                <input type="text" value={formBahan.name} onChange={e=>setFormBahan({...formBahan, name: e.target.value})} placeholder="Nama Bahan / Sparepart" className="w-full p-2 border rounded-xl text-xs" />
                                <div className="grid grid-cols-2 gap-2">
                                    <input type="text" value={formBahan.unit} onChange={e=>setFormBahan({...formBahan, unit: e.target.value})} placeholder="Satuan (kg/pcs/L)" className="w-full p-2 border rounded-xl text-xs" />
                                    <input type="number" value={formBahan.qty} onChange={e=>setFormBahan({...formBahan, qty: e.target.value})} placeholder="Stok Awal" className="w-full p-2 border rounded-xl text-xs" />
                                </div>
                                <input type="number" value={formBahan.price} onChange={e=>setFormBahan({...formBahan, price: e.target.value})} placeholder="Harga Beli per Satuan" className="w-full p-2 border rounded-xl text-xs" />
                                <div className="flex gap-2 pt-2">
                                    <button onClick={() => setBahanModal(false)} className="flex-1 py-2.5 border font-bold text-xs rounded-xl">Batal</button>
                                    <button onClick={handleSaveBahan} className="flex-1 py-2.5 bg-blue-600 text-white font-bold text-xs rounded-xl">Simpan Gudang</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL MENU & RESEP */}
                    {menuModal && (
                        <div className="fixed inset-0 bg-black/50 z-50 flex items-end justify-center">
                            <div className="bg-white w-full max-w-[480px] p-5 rounded-t-3xl space-y-3 max-h-[85vh] overflow-y-auto">
                                <h3 className="font-extrabold text-slate-800 text-sm">Tambah Menu & Resep Gudang</h3>
                                <div className="grid grid-cols-3 gap-2">
                                    <input type="text" value={formMenu.name} onChange={e=>setFormMenu({...formMenu, name: e.target.value})} placeholder="Nama Menu/Jasa" className="col-span-2 p-2 border rounded-xl text-xs" />
                                    <input type="text" value={formMenu.icon} onChange={e=>setFormMenu({...formMenu, icon: e.target.value})} placeholder="Emoji" className="p-2 border rounded-xl text-xs text-center" />
                                </div>
                                <input type="number" value={formMenu.price} onChange={e=>setFormMenu({...formMenu, price: e.target.value})} placeholder="Harga Jual (Rp)" className="w-full p-2 border rounded-xl text-xs" />

                                <div className="border-t pt-2 space-y-2">
                                    <div className="flex justify-between items-center">
                                        <label className="text-xs font-bold text-slate-700">Resep Bahan Baku (Gudang)</label>
                                        <button type="button" onClick={() => setFormMenu({...formMenu, ingredients: [...formMenu.ingredients, { stockId: '', qty: '' }]})} className="text-[11px] font-extrabold text-blue-600">+ Resep</button>
                                    </div>
                                    {formMenu.ingredients.map((ing, idx) => (
                                        <div key={idx} className="flex gap-2">
                                            <select value={ing.stockId} onChange={e => {
                                                const newIng = [...formMenu.ingredients];
                                                newIng[idx].stockId = e.target.value;
                                                setFormMenu({...formMenu, ingredients: newIng});
                                            }} className="flex-1 p-2 border rounded-xl text-xs">
                                                <option value="">-- Pilih Bahan --</option>
                                                {stocks.map(s => <option key={s.id} value={s.id}>{s.name} ({s.unit})</option>)}
                                            </select>
                                            <input type="number" step="0.001" value={ing.qty} onChange={e => {
                                                const newIng = [...formMenu.ingredients];
                                                newIng[idx].qty = e.target.value;
                                                setFormMenu({...formMenu, ingredients: newIng});
                                            }} placeholder="Takaran" className="w-20 p-2 border rounded-xl text-xs" />
                                        </div>
                                    ))}
                                </div>

                                <div className="flex gap-2 pt-2">
                                    <button onClick={() => setMenuModal(false)} className="flex-1 py-2.5 border font-bold text-xs rounded-xl">Batal</button>
                                    <button onClick={handleSaveMenu} className="flex-1 py-2.5 bg-blue-600 text-white font-bold text-xs rounded-xl">Simpan Menu</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* BOTTOM NAVIGATION */}
                    <nav className="fixed bottom-0 left-0 right-0 max-w-[480px] mx-auto bg-white border-t flex justify-around py-2 z-20 shadow-lg">
                        {[
                            { id: 'kasir', label: 'Kasir', icon: '🛒' },
                            { id: 'gudang', label: 'Gudang', icon: '📦' },
                            { id: 'laporan', label: 'Laporan', icon: '📊' },
                            { id: 'pengaturan', label: 'Atur Usaha', icon: '⚙️' }
                        ].map(t => (
                            <button 
                                key={t.id} 
                                onClick={() => setTab(t.id)} 
                                className={`flex flex-col items-center text-[10px] font-bold ${tab === t.id ? 'text-blue-600' : 'text-slate-400'}`}
                            >
                                <span className="text-base leading-none">{t.icon}</span>
                                {t.label}
                            </button>
                        ))}
                    </nav>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
